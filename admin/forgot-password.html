<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Forgot Password | Tekvwarho IT Solutions</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <h1>Reset Password</h1>
            <p id="form-subtitle">Enter your email to receive a password reset link</p>
        </div>
        
        <!-- Request Reset Form -->
        <form class="login-form" id="forgot-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="Enter your email address">
            </div>
            <div id="form-error" class="text-danger mb-3" style="display: none;"></div>
            <div id="form-success" class="text-success mb-3" style="display: none;"></div>
            <button type="submit" class="btn btn-primary" id="submit-btn">Send Reset Link</button>
        </form>
        
        <!-- Success Message (Hidden by default) -->
        <div id="success-message" style="display: none; text-align: center; padding: 20px;">
            <div style="font-size: 48px; margin-bottom: 15px;">📧</div>
            <h3 style="margin-bottom: 10px; color: #059669;">Check Your Email</h3>
            <p style="color: #666; margin-bottom: 20px;">
                If an account exists with the email you entered, you'll receive a password reset link shortly.
            </p>
            <p style="color: #888; font-size: 14px;">
                Didn't receive the email? Check your spam folder or 
                <a href="#" id="resend-link" style="color: #0066CC;">try again</a>.
            </p>
        </div>
        
        <div class="login-footer">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>
    
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('form-error');
            const successDiv = document.getElementById('form-success');
            const email = document.getElementById('email').value;
            
            btn.disabled = true;
            btn.textContent = 'Sending...';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Show success message
                    document.getElementById('forgot-form').style.display = 'none';
                    document.getElementById('success-message').style.display = 'block';
                    document.getElementById('form-subtitle').style.display = 'none';
                } else {
                    errorDiv.textContent = data.message || 'Something went wrong. Please try again.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Unable to connect to server. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        });
        
        // Resend link handler
        document.getElementById('resend-link').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('forgot-form').style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
            document.getElementById('form-subtitle').style.display = 'block';
        });
    </script>
</body>
</html>
