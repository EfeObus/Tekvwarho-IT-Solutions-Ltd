# Tekvwarho IT Solutions - Docker Compose Configuration
# Run with: docker-compose up -d

version: '3.8'

services:
  # ===========================================
  # Application Server
  # ===========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tekvwarho-app
    restart: unless-stopped
    ports:
      - "${PORT:-5500}:5500"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5500
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tekvwarho}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@tekvwarho.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-TekvwarhoAdmin2026!}
      - SITE_URL=${SITE_URL:-http://localhost:5500}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tekvwarho-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5500/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: tekvwarho-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-tekvwarho}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - tekvwarho-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tekvwarho}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Nginx Reverse Proxy (Optional - for production)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: tekvwarho-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - tekvwarho-network
    profiles:
      - production

# ===========================================
# Networks
# ===========================================
networks:
  tekvwarho-network:
    driver: bridge

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    driver: local
