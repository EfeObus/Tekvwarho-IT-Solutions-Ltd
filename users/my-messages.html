<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>My Messages | Tekvwarho Staff Portal</title>
    <link rel="stylesheet" href="../admin/css/admin.css">
    <link rel="stylesheet" href="../admin/css/dataTable.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Staff Portal</h2>
                <span class="subtitle">Dashboard</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <span class="nav-section-title">Overview</span>
                    <a href="dashboard.html" class="nav-item">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                </div>
                <div class="nav-section">
                    <span class="nav-section-title">My Work</span>
                    <a href="my-messages.html" class="nav-item active">
                        <i class="fas fa-envelope"></i> My Messages
                    </a>
                    <a href="my-consultations.html" class="nav-item">
                        <i class="fas fa-calendar"></i> My Consultations
                    </a>
                    <a href="my-chats.html" class="nav-item">
                        <i class="fas fa-comments"></i> Live Chats
                    </a>
                </div>
                <div class="nav-section">
                    <span class="nav-section-title">Settings</span>
                    <a href="profile.html" class="nav-item">
                        <i class="fas fa-user"></i> My Profile
                    </a>
                    <a href="../index.html" class="nav-item">
                        <i class="fas fa-globe"></i> View Website
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <button class="sidebar-toggle" id="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>My Messages</h1>
                <div class="header-actions">
                    <span class="user-name" id="user-name"></span>
                    <button class="btn btn-outline-primary" id="logout-btn">Logout</button>
                </div>
            </header>

            <div class="admin-content">
                <!-- Filters -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="filters-row">
                            <div class="filter-group">
                                <label>Status</label>
                                <select id="filter-status" class="form-control">
                                    <option value="">All Statuses</option>
                                    <option value="new">New</option>
                                    <option value="in_progress">In Progress</option>
                                    <option value="converted">Converted</option>
                                    <option value="archived">Archived</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>Search</label>
                                <input type="text" id="filter-search" class="form-control" placeholder="Search messages...">
                            </div>
                            <button class="btn btn-primary" id="apply-filters">
                                <i class="fas fa-filter"></i> Filter
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Messages Table -->
                <div class="card">
                    <div class="card-header">
                        <h2>Assigned Messages</h2>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Service</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="messages-table">
                                    <tr>
                                        <td colspan="6" class="text-center">Loading...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="pagination" id="pagination"></div>
                    </div>
                </div>
            </div>
        </main>
        <!-- Sidebar Overlay for Mobile -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
    </div>

    <!-- Message Detail Modal -->
    <div class="modal" id="message-modal" style="display: none;">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h2>Message Details</h2>
                <button class="modal-close" id="close-modal">&times;</button>
            </div>
            <div class="modal-body" id="message-details">
                <!-- Content loaded dynamically -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="close-modal-btn">Close</button>
                <button class="btn btn-primary" id="reply-btn">Reply</button>
            </div>
        </div>
    </div>

    <script>
        // Auth check
        const token = localStorage.getItem('adminToken');
        const user = JSON.parse(localStorage.getItem('adminUser') || '{}');
        
        if (!token || !user.id) {
            window.location.href = 'index.html';
        }

        if (!user.can_manage_messages) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('user-name').textContent = user.name;

        let currentPage = 1;
        const limit = 10;
        let currentMessageId = null;

        async function loadMessages() {
            const status = document.getElementById('filter-status').value;
            const search = document.getElementById('filter-search').value;
            
            try {
                let url = `/api/admin/messages?page=${currentPage}&limit=${limit}&assigned_to=${user.id}`;
                if (status) url += `&status=${status}`;
                if (search) url += `&search=${encodeURIComponent(search)}`;

                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.success) {
                    renderMessages(data.messages || data.data || []);
                    renderPagination(data.pagination || { page: 1, total: 0, pages: 1 });
                }
            } catch (error) {
                console.error('Failed to load messages:', error);
            }
        }

        function renderMessages(messages) {
            const tbody = document.getElementById('messages-table');
            
            if (messages.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">No messages assigned to you.</td></tr>';
                return;
            }

            tbody.innerHTML = messages.map(msg => `
                <tr>
                    <td>${formatDate(msg.created_at)}</td>
                    <td>${escapeHtml(msg.name)}</td>
                    <td>${escapeHtml(msg.email)}</td>
                    <td>${escapeHtml(msg.service || 'N/A')}</td>
                    <td><span class="badge badge-${getStatusColor(msg.status)}">${msg.status}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick="viewMessage('${msg.id}')">
                            <i class="fas fa-eye"></i> View
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination(pagination) {
            const container = document.getElementById('pagination');
            if (pagination.pages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= pagination.pages; i++) {
                html += `<button class="btn btn-sm ${i === pagination.page ? 'btn-primary' : 'btn-outline'}" onclick="goToPage(${i})">${i}</button> `;
            }
            container.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadMessages();
        }

        async function viewMessage(id) {
            currentMessageId = id;
            try {
                const response = await fetch(`/api/admin/messages/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.success) {
                    const msg = data.message || data.data;
                    document.getElementById('message-details').innerHTML = `
                        <div class="message-info">
                            <p><strong>From:</strong> ${escapeHtml(msg.name)} (${escapeHtml(msg.email)})</p>
                            <p><strong>Company:</strong> ${escapeHtml(msg.company || 'N/A')}</p>
                            <p><strong>Service:</strong> ${escapeHtml(msg.service || 'N/A')}</p>
                            <p><strong>Date:</strong> ${formatDate(msg.created_at)}</p>
                            <p><strong>Status:</strong> <span class="badge badge-${getStatusColor(msg.status)}">${msg.status}</span></p>
                        </div>
                        <hr>
                        <div class="message-content">
                            <h4>Message</h4>
                            <p>${escapeHtml(msg.message)}</p>
                        </div>
                        <hr>
                        <div class="reply-section">
                            <h4>Reply</h4>
                            <textarea id="reply-content" class="form-control" rows="4" placeholder="Type your reply... This will be sent to the visitor's email."></textarea>
                        </div>
                    `;
                    document.getElementById('message-modal').style.display = 'flex';
                }
            } catch (error) {
                console.error('Failed to load message:', error);
            }
        }

        function getStatusColor(status) {
            const colors = {
                'new': 'info',
                'in_progress': 'warning',
                'converted': 'success',
                'archived': 'secondary'
            };
            return colors[status] || 'secondary';
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.getElementById('apply-filters').addEventListener('click', () => {
            currentPage = 1;
            loadMessages();
        });

        document.getElementById('filter-search').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                currentPage = 1;
                loadMessages();
            }
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('message-modal').style.display = 'none';
        });

        document.getElementById('close-modal-btn').addEventListener('click', () => {
            document.getElementById('message-modal').style.display = 'none';
        });

        document.getElementById('reply-btn').addEventListener('click', async () => {
            const content = document.getElementById('reply-content')?.value;
            if (!content || !content.trim()) {
                alert('Please enter a reply message');
                return;
            }
            
            try {
                const response = await fetch(`/api/contact/${currentMessageId}/reply`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        content,
                        staffId: user.id,
                        sendEmail: true
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (data.emailSent) {
                        alert('Reply sent successfully! Email delivered to the visitor.');
                    } else if (data.emailError) {
                        alert(`Reply saved but email failed: ${data.emailError}`);
                    } else {
                        alert('Reply saved successfully.');
                    }
                    document.getElementById('message-modal').style.display = 'none';
                    loadMessages();
                } else {
                    alert(data.message || 'Failed to send reply');
                }
            } catch (error) {
                console.error('Reply error:', error);
                alert('Failed to send reply');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = 'index.html';
        });

        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        document.getElementById('menu-toggle').addEventListener('click', () => {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('active');
        });

        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
        });

        // Initial load
        loadMessages();
    </script>
</body>
</html>
